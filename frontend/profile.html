<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的报名</title>
    <link rel="icon" href="data:,">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: #ededed;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #07c160;
            color: white;
            padding: 18px 28px;
            border-radius: 12px;
            margin-bottom: 22px;
            box-shadow: 0 2px 12px rgba(7, 193, 96, 0.2);
        }

        .header h1 {
            font-size: 20px;
            font-weight: 500;
        }

        .header a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
            font-size: 14px;
            opacity: 0.9;
        }

        .header a:hover {
            opacity: 1;
            text-decoration: underline;
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
        }

        .reg-card {
            background: #fff;
            border-radius: 12px;
            padding: 22px 25px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }

        .reg-card:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        .reg-info h3 {
            color: #191919;
            margin-bottom: 10px;
            font-size: 16px;
            font-weight: 500;
        }

        .reg-info p {
            color: #888;
            font-size: 13px;
            margin: 5px 0;
            line-height: 1.6;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-registered {
            background: #e8f0fd;
            color: #576b95;
        }

        .status-checked_in {
            background: #e8f8ef;
            color: #07c160;
        }

        .status-cancelled {
            background: #fdecec;
            color: #fa5151;
        }

        .btn-cancel {
            margin-top: 10px;
            padding: 6px 14px;
            background: #fff;
            color: #fa5151;
            border: 1px solid #fa5151;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .btn-cancel:hover {
            background: #fa5151;
            color: white;
        }

        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 14px 24px;
            border-radius: 8px;
            font-size: 15px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s;
            z-index: 9999;
        }
        .toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .confirm-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }
        .confirm-box {
            background: white;
            border-radius: 12px;
            width: 320px;
            padding: 25px 20px 20px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
        }
        .confirm-title {
            font-size: 16px;
            font-weight: 500;
            color: #191919;
            margin-bottom: 12px;
        }
        .confirm-message {
            font-size: 14px;
            color: #666;
            margin-bottom: 22px;
            line-height: 1.6;
        }
        .confirm-buttons {
            display: flex;
            gap: 10px;
        }
        .confirm-btn {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
        }
        .confirm-btn.cancel { background: #f7f7f7; color: #666; }
        .confirm-btn.cancel:hover { background: #eee; }
        .confirm-btn.ok { background: #07c160; color: white; }
        .confirm-btn.ok:hover { background: #06ad56; }

        .empty-msg {
            text-align: center;
            color: #999;
            margin-top: 60px;
            font-size: 15px;
        }
    </style>
</head>

<body>

<!-- 统一为所有 API 请求附带登录令牌；令牌失效自动跳回登录页 -->
<script>
    (function () {
        const _fetch = window.fetch.bind(window);
        window.fetch = function (input, init) {
            init = init || {};
            const token = localStorage.getItem('token');
            if (token) {
                init.headers = Object.assign({}, init.headers, { 'Authorization': 'Bearer ' + token });
            }
            return _fetch(input, init).then(function (res) {
                if (res.status === 401 && location.pathname !== '/' && location.pathname.indexOf('login') === -1) {
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                    window.location.href = 'login.html';
                }
                return res;
            });
        };
    })();
</script>

    <div id="toast" class="toast"><span id="toast-text"></span></div>

    <div id="confirm-modal" class="confirm-modal" style="display:none;">
        <div class="confirm-box">
            <div class="confirm-title">提示</div>
            <div class="confirm-message" id="confirm-message">确定要执行此操作吗？</div>
            <div class="confirm-buttons">
                <button class="confirm-btn cancel" onclick="closeConfirm(false)">取消</button>
                <button class="confirm-btn ok" onclick="closeConfirm(true)">确定</button>
            </div>
        </div>
    </div>

    <div class="header">
        <h1>📋 我的报名</h1>
        <div>
            <a href="index.html">返回大厅</a>
            <a href="#" onclick="logout()">退出登录</a>
        </div>
    </div>

    <div class="container" id="registration-list"></div>

    <!-- 修改密码 -->
    <div class="container" style="margin-top:20px;">
        <h3 style="margin-bottom:12px; font-size:15px;">🔑 修改密码</h3>
        <div style="display:flex; flex-wrap:wrap; gap:10px; align-items:center;">
            <input type="password" id="old-password" placeholder="旧密码" autocomplete="current-password"
                   style="flex:1; min-width:160px; padding:10px; border:1px solid #e5e5e5; border-radius:8px;">
            <input type="password" id="new-password" placeholder="新密码（≥8 位，含大小写与数字）" autocomplete="new-password"
                   style="flex:1; min-width:200px; padding:10px; border:1px solid #e5e5e5; border-radius:8px;">
            <button class="btn-cancel" style="width:auto; padding:10px 22px;" onclick="changePassword(this)">确认修改</button>
        </div>
        <p style="color:#999; font-size:12px; margin-top:8px;">修改成功后需要重新登录（旧登录令牌会全部失效）。</p>
    </div>

    <script>
        const userStr = localStorage.getItem('user');
        if (!userStr) {
            location.replace('login.html');
            throw new Error('未登录，已跳转');
        }
        let currentUser;
        try {
            currentUser = JSON.parse(userStr);
        } catch (e) {
            localStorage.removeItem('user');
            localStorage.removeItem('token');
            location.replace('login.html');
            throw e;
        }

        // HTML 转义（防 XSS）
        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function logout() {
            fetch('/api/logout', { method: 'POST' }).catch(() => {}).finally(() => {
                localStorage.removeItem('user');
                localStorage.removeItem('token');
                window.location.href = 'login.html';
            });
        }

        // Toast 提示
        function showToast(message, duration = 1800) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-text').textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), duration);
        }

        // 自定义确认弹窗
        let confirmResolve = null;

        function showConfirm(message) {
            return new Promise((resolve) => {
                document.getElementById('confirm-message').textContent = message;
                document.getElementById('confirm-modal').style.display = 'flex';
                confirmResolve = resolve;
            });
        }

        function closeConfirm(result) {
            document.getElementById('confirm-modal').style.display = 'none';
            if (confirmResolve) {
                confirmResolve(result);
                confirmResolve = null;
            }
        }
        // 时间格式化工具
        function formatDateTime(dateStr) {
            if (!dateStr) return '';
            const str = String(dateStr).replace('T', ' ');
            const datePart = str.split(' ')[0];
            const timePart = str.split(' ')[1] || '';

            if (!datePart) return str;

            const [y, m, d] = datePart.split('-');
            const [hh, mm] = timePart.split(':');

            if (!hh || !mm) {
                return `${y}年${parseInt(m)}月${parseInt(d)}日`;
            }
            return `${y}年${parseInt(m)}月${parseInt(d)}日 ${hh}:${mm}`;
        }


        let myRegPage = 1;
        let myRegPages = 0;

        async function loadMyRegistrations(reset = true) {
            const targetPage = reset ? 1 : myRegPage + 1;
            try {
                const response = await fetch(`/api/user_registrations/${currentUser.user_id}?page=${targetPage}&page_size=20`);
                const result = await response.json();
                const listDiv = document.getElementById('registration-list');

                // 先把错误显示清楚：不能把 401/500 也说成「你还没有报名」
                if (result.code !== 200) {
                    if (reset) {
                        listDiv.innerHTML = `<p style="color:#fa5151; text-align:center;">${escapeHtml(result.message || '加载失败')}</p>`;
                    }
                    return;
                }
                if (reset) listDiv.innerHTML = '';
                myRegPage = targetPage;

                if (result.data.length > 0) {
                    result.data.forEach(reg => {
                        const card = document.createElement('div');
                        card.className = 'reg-card';

                        let statusText = '已报名';
                        let statusClass = 'status-registered';
                        if (reg.registration_status === 'checked_in') { statusText = '已签到'; statusClass = 'status-checked_in'; }
                        else if (reg.registration_status === 'cancelled') { statusText = '已取消'; statusClass = 'status-cancelled'; }

                        // 后台不允许活动开始后取消，前端也不再展示无用按钮
                        const started = reg.start_time && new Date(String(reg.start_time).replace(' ', 'T')) <= new Date();
                        const cancelBtn = (reg.registration_status === 'registered' && !started)
                            ? `<button class="btn-cancel" onclick="cancelRegistration(${reg.registration_id}, this)">取消报名</button>`
                            : '';

                        const checkinLine = reg.check_in_time
                            ? `<p>✅ 签到时间：${formatDateTime(reg.check_in_time)}</p>`
                            : '';

                        card.innerHTML = `
                        <div class="reg-info">
                            <h3>${escapeHtml(reg.event_title)}</h3>
                            <p>📍 地点：${escapeHtml(reg.venue_name)}（${escapeHtml(reg.location)}）</p>
                            <p>📅 活动时间：${formatDateTime(reg.start_time)}</p>
                            <p>📝 报名时间：${formatDateTime(reg.registered_at)}</p>
                            ${checkinLine}
                        </div>
                        <div style="text-align: right;">
                            <span class="status-badge ${statusClass}">${statusText}</span>
                            <br>
                            ${cancelBtn}
                        </div>
                    `;
                        listDiv.appendChild(card);
                    });
                } else if (reset) {
                    listDiv.innerHTML = '<p class="empty-msg">你还没有报名任何活动</p>';
                }

                myRegPages = result.pages || 0;
                let more = document.getElementById('my-reg-more');
                if (!more) {
                    more = document.createElement('button');
                    more.id = 'my-reg-more';
                    more.className = 'btn-cancel';
                    more.style.cssText = 'display:block; margin:20px auto; padding:10px 30px;';
                    more.textContent = '加载更多';
                    more.onclick = () => loadMyRegistrations(false);
                    listDiv.parentElement.appendChild(more);
                }
                more.style.display = myRegPage < myRegPages ? 'block' : 'none';
            } catch (error) {
                console.error(error);
                if (reset) {
                    document.getElementById('registration-list').innerHTML = '<p style="color:#fa5151; text-align:center;">无法连接后端，请确认后端已启动。</p>';
                }
            }
        }

        async function cancelRegistration(registrationId, btn) {
            const ok = await showConfirm('确定要取消报名吗？取消后名额将释放。');
            if (!ok) return;
            if (btn) { btn.disabled = true; btn.textContent = '取消中…'; }
            try {
                const response = await fetch(`/api/cancel_registration/${registrationId}`, { method: 'PUT' });
                const data = await response.json();
                if (data.code === 200) {
                    showToast('✓ ' + data.message);
                    loadMyRegistrations();
                } else {
                    showToast('✗ ' + data.message);
                    if (btn) { btn.disabled = false; btn.textContent = '取消报名'; }
                }
            } catch (error) {
                showToast('⚠ 网络错误，请检查后端');
                if (btn) { btn.disabled = false; btn.textContent = '取消报名'; }
            }
        }

        async function changePassword(btn) {
            const oldPwd = document.getElementById('old-password').value;
            const newPwd = document.getElementById('new-password').value;
            if (!oldPwd || !newPwd) { showToast('⚠ 请填写旧密码和新密码'); return; }
            if (btn) { btn.disabled = true; btn.textContent = '提交中…'; }
            try {
                const response = await fetch('/api/change_password', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ old_password: oldPwd, new_password: newPwd })
                });
                const data = await response.json();
                if (data.code === 200) {
                    showToast('✓ ' + data.message);
                    // 旧令牌已失效，直接用返回的新令牌续上，或重新登录
                    if (data.token) localStorage.setItem('token', data.token);
                    document.getElementById('old-password').value = '';
                    document.getElementById('new-password').value = '';
                } else {
                    showToast('✗ ' + data.message);
                }
            } catch (error) {
                showToast('⚠ 网络错误，请检查后端');
            } finally {
                if (btn) { btn.disabled = false; btn.textContent = '确认修改'; }
            }
        }

        loadMyRegistrations();
    </script>

</body>

</html>
