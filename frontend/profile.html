<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的报名</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: #ededed;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #07c160;
            color: white;
            padding: 18px 28px;
            border-radius: 12px;
            margin-bottom: 22px;
            box-shadow: 0 2px 12px rgba(7, 193, 96, 0.2);
        }

        .header h1 {
            font-size: 20px;
            font-weight: 500;
        }

        .header a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
            font-size: 14px;
            opacity: 0.9;
        }

        .header a:hover {
            opacity: 1;
            text-decoration: underline;
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
        }

        .reg-card {
            background: #fff;
            border-radius: 12px;
            padding: 22px 25px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }

        .reg-card:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        .reg-info h3 {
            color: #191919;
            margin-bottom: 10px;
            font-size: 16px;
            font-weight: 500;
        }

        .reg-info p {
            color: #888;
            font-size: 13px;
            margin: 5px 0;
            line-height: 1.6;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-registered {
            background: #e8f0fd;
            color: #576b95;
        }

        .status-checked_in {
            background: #e8f8ef;
            color: #07c160;
        }

        .status-cancelled {
            background: #fdecec;
            color: #fa5151;
        }

        .btn-cancel {
            margin-top: 10px;
            padding: 6px 14px;
            background: #fff;
            color: #fa5151;
            border: 1px solid #fa5151;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .btn-cancel:hover {
            background: #fa5151;
            color: white;
        }

        .empty-msg {
            text-align: center;
            color: #999;
            margin-top: 60px;
            font-size: 15px;
        }
    </style>
</head>

<body>

<!-- 统一为所有 API 请求附带登录令牌；令牌失效自动跳回登录页（修改版新增） -->
<script>
    (function () {
        const _fetch = window.fetch.bind(window);
        window.fetch = function (input, init) {
            init = init || {};
            const token = localStorage.getItem('token');
            if (token) {
                init.headers = Object.assign({}, init.headers, { 'Authorization': 'Bearer ' + token });
            }
            return _fetch(input, init).then(function (res) {
                if (res.status === 401 && location.pathname.indexOf('login') === -1) {
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                    window.location.href = 'login.html';
                }
                return res;
            });
        };
    })();
</script>

    <div class="header">
        <h1>📋 我的报名</h1>
        <div>
            <a href="index.html">返回大厅</a>
            <a href="#" onclick="logout()">退出登录</a>
        </div>
    </div>

    <div class="container" id="registration-list"></div>

    <script>
        const userStr = localStorage.getItem('user');
        if (!userStr) { alert('请先登录！'); window.location.href = 'login.html'; }
        const currentUser = JSON.parse(userStr);

        function logout() {
            localStorage.removeItem('user');
            localStorage.removeItem('token');
            window.location.href = 'login.html';
        }
        // ============ 时间格式化工具 ============
        function formatDateTime(dateStr) {
            if (!dateStr) return '';
            const str = String(dateStr).replace('T', ' ');
            const datePart = str.split(' ')[0];
            const timePart = str.split(' ')[1] || '';

            if (!datePart) return str;

            const [y, m, d] = datePart.split('-');
            const [hh, mm] = timePart.split(':');

            if (!hh || !mm) {
                return `${y}年${parseInt(m)}月${parseInt(d)}日`;
            }
            return `${y}年${parseInt(m)}月${parseInt(d)}日 ${hh}:${mm}`;
        }


        async function loadMyRegistrations() {
            try {
                const response = await fetch(`/api/user_registrations/${currentUser.user_id}`);
                const result = await response.json();
                const listDiv = document.getElementById('registration-list');
                listDiv.innerHTML = '';

                if (result.code === 200 && result.data.length > 0) {
                    result.data.forEach(reg => {
                        const card = document.createElement('div');
                        card.className = 'reg-card';

                        let statusText = '已报名';
                        let statusClass = 'status-registered';
                        if (reg.registration_status === 'checked_in') { statusText = '已签到'; statusClass = 'status-checked_in'; }
                        else if (reg.registration_status === 'cancelled') { statusText = '已取消'; statusClass = 'status-cancelled'; }

                        const cancelBtn = reg.registration_status === 'registered'
                            ? `<button class="btn-cancel" onclick="cancelRegistration(${reg.registration_id})">取消报名</button>`
                            : '';

                        card.innerHTML = `
                        <div class="reg-info">
                            <h3>${reg.event_title}</h3>
                            <p>📍 地点：${reg.venue_name}（${reg.location}）</p>
                            <p>📍 地点：${reg.venue_name}（${reg.location}）</p>
                            <p>📅 活动时间：${formatDateTime(reg.start_time)}</p>
                            <p>📝 报名时间：${formatDateTime(reg.registered_at)}</p>
                        </div>
                        <div style="text-align: right;">
                            <span class="status-badge ${statusClass}">${statusText}</span>
                            <br>
                            ${cancelBtn}
                        </div>
                    `;
                        listDiv.appendChild(card);
                    });
                } else {
                    listDiv.innerHTML = '<p class="empty-msg">你还没有报名任何活动</p>';
                }
            } catch (error) {
                console.error(error);
                document.getElementById('registration-list').innerHTML = '<p style="color:#fa5151; text-align:center;">无法连接后端，请确认后端已启动。</p>';
            }
        }

        async function cancelRegistration(registrationId) {
            if (!confirm('确定要取消报名吗？取消后名额将释放。')) return;
            try {
                const response = await fetch(`/api/cancel_registration/${registrationId}`, { method: 'PUT' });
                const data = await response.json();
                if (data.code === 200) { alert('取消报名成功！'); loadMyRegistrations(); }
                else { alert('取消失败: ' + data.message); }
            } catch (error) { alert('网络错误，请检查后端。'); }
        }

        loadMyRegistrations();
    </script>

</body>

</html>
