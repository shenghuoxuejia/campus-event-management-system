<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园活动大厅</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: #ededed;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #07c160;
            color: white;
            padding: 18px 28px;
            border-radius: 12px;
            margin-bottom: 22px;
            box-shadow: 0 2px 12px rgba(7, 193, 96, 0.2);
        }
        .header h1 { font-size: 20px; font-weight: 500; }
        .header .user-info { font-size: 14px; }
        .header a { color: white; text-decoration: none; margin-left: 15px; opacity: 0.9; }
        .header a:hover { opacity: 1; text-decoration: underline; }
        .header button {
            margin-left: 15px;
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }
        .header button:hover { background: rgba(255, 255, 255, 0.3); }

        .panel {
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 22px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        .panel h3 { margin-bottom: 18px; color: #191919; font-size: 17px; font-weight: 500; }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }
        .form-grid input, .form-grid select {
            padding: 12px 14px;
            background: #f7f7f7;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            font-family: inherit;
            transition: all 0.2s;
        }
        .form-grid input:focus, .form-grid select:focus {
            border-color: #07c160;
            background: #fff;
        }

        .btn-primary {
            margin-top: 15px;
            padding: 12px 30px;
            background: #07c160;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary:hover { background: #06ad56; }

        .event-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 18px;
        }
        .event-card {
            background: #fff;
            border-radius: 12px;
            padding: 22px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            transition: all 0.2s;
        }
        .event-card:hover { box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08); }
        .event-card h3 { color: #191919; margin-bottom: 12px; font-size: 17px; font-weight: 500; }
        .event-card p { color: #888; font-size: 13px; margin: 6px 0; line-height: 1.6; }

        .status-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 10px;
            width: fit-content;
        }
        .status-open { background: #e8f8ef; color: #07c160; }
        .status-closed { background: #fdecec; color: #fa5151; }

        .btn-apply {
            width: 100%;
            padding: 11px;
            margin-top: 15px;
            background: #07c160;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-apply:hover:not(:disabled) { background: #06ad56; }
        .btn-apply:disabled { background: #ccc; cursor: not-allowed; }

        .btn-delete {
            width: 100%;
            margin-top: 8px;
            padding: 10px;
            background: #fff;
            color: #fa5151;
            border: 1px solid #fa5151;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-delete:hover { background: #fa5151; color: white; }

        /* 弹窗样式 */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-content {
            background: white;
            border-radius: 12px;
            width: 100%;
            max-width: 600px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 25px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #eee;
        }
        .modal-header h3 { font-size: 18px; color: #191919; font-weight: 500; }
        .modal-close { font-size: 28px; color: #888; cursor: pointer; line-height: 1; padding: 0 8px; }
        .modal-close:hover { color: #fa5151; }

        .section { margin-bottom: 25px; }
        .section h4 { font-size: 15px; color: #191919; font-weight: 500; margin-bottom: 12px; }

        .reg-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: #f7f7f7;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .reg-item .name { color: #191919; font-weight: 500; margin-bottom: 2px; }
        .reg-item .email { color: #888; font-size: 12px; }

        .btn-checkin {
            padding: 5px 14px;
            background: #07c160;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 12px;
            cursor: pointer;
        }
        .btn-checkin:hover { background: #06ad56; }
        .checkin-status { font-size: 12px; color: #07c160; font-weight: 500; }

        .comment-item {
            padding: 12px 14px;
            background: #f7f7f7;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .comment-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 12px;
        }
        .comment-author { color: #576b95; font-weight: 500; }
        .comment-time { color: #999; }
        .comment-content { color: #191919; font-size: 14px; line-height: 1.6; word-break: break-word; }

        .comment-form { margin-top: 15px; }
        .comment-form textarea {
            width: 100%;
            min-height: 80px;
            padding: 12px;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            outline: none;
            background: #f7f7f7;
        }
        .comment-form textarea:focus { border-color: #07c160; background: white; }
        .comment-form .btn-primary { margin-top: 10px; width: 100%; padding: 11px; font-size: 14px; }

        .empty-tip { color: #999; text-align: center; padding: 20px; font-size: 14px; }

        .btn-delete-comment {
            padding: 3px 10px;
            background: transparent;
            color: #fa5151;
            border: 1px solid #fa5151;
            border-radius: 5px;
            font-size: 11px;
            cursor: pointer;
            margin-left: 8px;
            transition: all 0.2s;
        }
        .btn-delete-comment:hover { background: #fa5151; color: white; }

        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 14px 24px;
            border-radius: 8px;
            font-size: 15px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s;
            z-index: 9999;
        }
        .toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* 自定义确认弹窗 */
        .confirm-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }
        .confirm-box {
            background: white;
            border-radius: 12px;
            width: 320px;
            padding: 25px 20px 20px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            animation: confirmFadeIn 0.2s ease;
        }
        @keyframes confirmFadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .confirm-title {
            font-size: 16px;
            font-weight: 500;
            color: #191919;
            margin-bottom: 12px;
        }
        .confirm-message {
            font-size: 14px;
            color: #666;
            margin-bottom: 22px;
            line-height: 1.6;
        }
        .confirm-buttons {
            display: flex;
            gap: 10px;
        }
        .confirm-btn {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }
        .confirm-btn.cancel { background: #f7f7f7; color: #666; }
        .confirm-btn.cancel:hover { background: #eee; }
        .confirm-btn.ok { background: #07c160; color: white; }
        .confirm-btn.ok:hover { background: #06ad56; }
    </style>
</head>

<body>

<!-- 统一为所有 API 请求附带登录令牌；令牌失效自动跳回登录页（修改版新增） -->
<script>
    (function () {
        const _fetch = window.fetch.bind(window);
        window.fetch = function (input, init) {
            init = init || {};
            const token = localStorage.getItem('token');
            if (token) {
                init.headers = Object.assign({}, init.headers, { 'Authorization': 'Bearer ' + token });
            }
            return _fetch(input, init).then(function (res) {
                if (res.status === 401 && location.pathname.indexOf('login') === -1) {
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                    window.location.href = 'login.html';
                }
                return res;
            });
        };
    })();
</script>

    <!-- Toast 提示组件 -->
    <div id="toast" class="toast">
        <span id="toast-text"></span>
    </div>

    <!-- 自定义确认弹窗 -->
    <div id="confirm-modal" class="confirm-modal" style="display:none;">
        <div class="confirm-box">
            <div class="confirm-title">提示</div>
            <div class="confirm-message" id="confirm-message">确定要执行此操作吗？</div>
            <div class="confirm-buttons">
                <button class="confirm-btn cancel" onclick="closeConfirm(false)">取消</button>
                <button class="confirm-btn ok" onclick="closeConfirm(true)">确定</button>
            </div>
        </div>
    </div>

    <div class="header">
        <h1>🎓 校园活动大厅</h1>
        <div class="user-info" id="user-info"></div>
    </div>

    <div id="organizer-panel" class="panel" style="display:none;">
        <h3>📢 发布新活动 <span style="color:#aaa; font-size:13px;">（仅组织者可见）</span></h3>
        <div class="form-grid">
            <input type="text" id="new-title" placeholder="活动标题">
            <input type="number" id="new-capacity" placeholder="容量（人数）">
            <select id="new-venue-id">
                <option value="">请选择场地</option>
            </select>
            <input type="datetime-local" id="new-start-time">
            <input type="datetime-local" id="new-end-time">
            <input type="text" id="new-description" placeholder="活动描述">
        </div>
        <button class="btn-primary" onclick="publishEvent()">发布活动</button>
    </div>

    <div class="event-grid" id="event-list"></div>

    <script>
        const userStr = localStorage.getItem('user');
        if (!userStr) { alert('请先登录！'); window.location.href = 'login.html'; }
        const currentUser = JSON.parse(userStr);

        // ============ Toast 提示 ============
        function showToast(message, duration = 1500) {
            const toast = document.getElementById('toast');
            const text = document.getElementById('toast-text');
            text.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, duration);
        }

        // ============ 自定义确认弹窗 ============
        let confirmResolve = null;

        function showConfirm(message) {
            return new Promise((resolve) => {
                document.getElementById('confirm-message').textContent = message;
                document.getElementById('confirm-modal').style.display = 'flex';
                confirmResolve = resolve;
            });
        }

        function closeConfirm(result) {
            document.getElementById('confirm-modal').style.display = 'none';
            if (confirmResolve) {
                confirmResolve(result);
                confirmResolve = null;
            }
        }

        // ============ 时间格式化 ============
        function formatDateTime(dateStr) {
            if (!dateStr) return '';
            const str = String(dateStr).replace('T', ' ');
            const datePart = str.split(' ')[0];
            const timePart = str.split(' ')[1] || '';
            if (!datePart) return str;
            const [y, m, d] = datePart.split('-');
            const [hh, mm] = timePart.split(':');
            if (!hh || !mm) {
                return `${y}年${parseInt(m)}月${parseInt(d)}日`;
            }
            return `${y}年${parseInt(m)}月${parseInt(d)}日 ${hh}:${mm}`;
        }

        // ============ 用户信息 ============
        document.getElementById('user-info').innerHTML = `
            ${currentUser.name} · ${currentUser.role}
            <a href="profile.html">我的报名</a>
            <button onclick="logout()">退出</button>
        `;

        if (currentUser.role === 'organizer') {
            document.getElementById('organizer-panel').style.display = 'block';
        }

        function logout() {
            localStorage.removeItem('user');
            localStorage.removeItem('token');
            window.location.href = 'login.html';
        }

        // ============ 删除活动 ============
        async function deleteEvent(eventId) {
            const ok = await showConfirm('确定要删除这个活动吗？该操作不可恢复，所有报名记录也会被删除。');
            if (!ok) return;
            try {
                const response = await fetch(`/api/delete_event/${eventId}`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ organizer_id: currentUser.user_id })
                });
                const data = await response.json();
                if (data.code === 200) {
                    showToast('✓ 活动已删除');
                    loadEvents();
                } else {
                    showToast('✗ ' + data.message);
                }
            } catch (error) {
                showToast('⚠ 网络错误');
            }
        }

        // ============ 加载活动列表 ============
        async function loadEvents() {
            try {
                const response = await fetch(`/api/events?user_id=${currentUser.user_id}`);
                const result = await response.json();
                const eventListDiv = document.getElementById('event-list');
                eventListDiv.innerHTML = '';

                if (result.code === 200 && result.data.length > 0) {
                    result.data.forEach(event => {
                        const card = document.createElement('div');
                        card.className = 'event-card';

                        const now = new Date();
                        const startTime = new Date(event.start_time);
                        const isOpen = event.status === 'open' && now < startTime;
                        const isRegistered = event.is_registered > 0;

                        const statusClass = isOpen ? 'status-open' : 'status-closed';
                        const statusText = isOpen ? '报名中' : '已结束';

                        let buttonText = '立即报名';
                        let buttonDisabled = false;
                        if (!isOpen) { buttonText = '活动已结束'; buttonDisabled = true; }
                        else if (isRegistered) { buttonText = '已报名'; buttonDisabled = true; }

                        const deleteBtn = currentUser.role === 'organizer'
                            ? `<button class="btn-delete" onclick="deleteEvent(${event.event_id})">删除活动</button>`
                            : '';

                        card.innerHTML = `
                            <span class="status-badge ${statusClass}">${statusText}</span>
                            <h3 style="cursor:pointer;" onclick="openDetail(${event.event_id}, '${event.title}')">${event.title} <span style="font-size:12px; color:#07c160;">详情 →</span></h3>
                            <p>${event.description || '暂无描述'}</p>
                            <p>📍 地点：${event.venue_name || '待定'}（${event.venue_location || ''}）</p>
                            <p>📅 时间：${formatDateTime(event.start_time)}</p>
                            <p>👥 容量：${event.capacity} 人</p>
                            <button class="btn-apply" onclick="applyEvent(${event.event_id})" ${buttonDisabled ? 'disabled' : ''}>
                                ${buttonText}
                            </button>
                            ${deleteBtn}
                        `;
                        eventListDiv.appendChild(card);
                    });
                } else {
                    eventListDiv.innerHTML = '<p style="text-align:center; color:#888; grid-column:1/-1;">暂无活动。</p>';
                }
            } catch (error) {
                console.error(error);
                document.getElementById('event-list').innerHTML = '<p style="color:#fa5151; text-align:center; grid-column:1/-1;">无法连接后端，请确认后端已启动。</p>';
            }
        }

        // ============ 报名 ============
        async function applyEvent(eventId) {
            const ok = await showConfirm('确定要报名参加这个活动吗？');
            if (!ok) return;
            try {
                const response = await fetch('/api/register_event', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ student_id: currentUser.user_id, event_id: eventId })
                });
                const data = await response.json();
                if (data.code === 200) {
                    showToast('✓ 报名成功');
                    loadEvents();
                } else {
                    showToast('✗ ' + data.message);
                }
            } catch (error) {
                showToast('⚠ 网络错误');
            }
        }

        // ============ 发布活动 ============
        async function publishEvent() {
            const title = document.getElementById('new-title').value;
            const capacity = document.getElementById('new-capacity').value;
            const venueId = document.getElementById('new-venue-id').value;
            const startTime = document.getElementById('new-start-time').value;
            const endTime = document.getElementById('new-end-time').value;
            const description = document.getElementById('new-description').value;

            if (!title || !capacity || !venueId || !startTime || !endTime) {
                showToast('⚠ 请填写所有必填字段');
                return;
            }

            try {
                const response = await fetch('/api/create_event', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        organizer_id: currentUser.user_id,
                        title, description,
                        venue_id: parseInt(venueId),
                        start_time: startTime.replace('T', ' ') + ':00',
                        end_time: endTime.replace('T', ' ') + ':00',
                        capacity: parseInt(capacity)
                    })
                });
                const data = await response.json();
                if (data.code === 200) {
                    showToast('✓ 活动发布成功');
                    ['new-title', 'new-capacity', 'new-venue-id', 'new-start-time', 'new-end-time', 'new-description'].forEach(id => document.getElementById(id).value = '');
                    loadEvents();
                } else {
                    showToast('✗ ' + data.message);
                }
            } catch (error) {
                showToast('⚠ 网络错误');
            }
        }

        // ============ 加载场地 ============
        async function loadVenues() {
            try {
                const response = await fetch('/api/venues');
                const result = await response.json();
                const select = document.getElementById('new-venue-id');
                if (result.code === 200) {
                    result.data.forEach(venue => {
                        const option = document.createElement('option');
                        option.value = venue.venue_id;
                        option.textContent = `${venue.venue_name}（${venue.location}，容量 ${venue.capacity}）`;
                        select.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('加载场地失败:', error);
            }
        }

        // ============ 活动详情弹窗 ============
        let currentEventId = null;

        async function openDetail(eventId, title) {
            currentEventId = eventId;
            document.getElementById('modal-title').textContent = title;
            document.getElementById('detail-modal').style.display = 'flex';
            document.getElementById('comment-input').value = '';
            await loadEventRegistrations(eventId);
            await loadComments(eventId);
        }

        function closeDetail() {
            document.getElementById('detail-modal').style.display = 'none';
            currentEventId = null;
        }

        // ============ 报名名单 ============
        async function loadEventRegistrations(eventId) {
            const listDiv = document.getElementById('registration-list-detail');
            listDiv.innerHTML = '<p class="empty-tip">加载中...</p>';
            try {
                const res = await fetch(`/api/event_registrations/${eventId}`);
                const result = await res.json();
                if (result.code === 200 && result.data.length > 0) {
                    listDiv.innerHTML = '';
                    result.data.forEach(reg => {
                        const item = document.createElement('div');
                        item.className = 'reg-item';
                        const isCheckedIn = reg.registration_status === 'checked_in';
                        const actionBtn = currentUser.role === 'organizer'
                            ? (isCheckedIn
                                ? `<span class="checkin-status">✓ 已签到</span>`
                                : `<button class="btn-checkin" onclick="checkInStudent(${reg.registration_id})">签到</button>`)
                            : (isCheckedIn ? `<span class="checkin-status">✓ 已签到</span>` : '');
                        item.innerHTML = `
                            <div>
                                <div class="name">${reg.student_name}</div>
                                <div class="email">${reg.student_email}</div>
                            </div>
                            <div>${actionBtn}</div>
                        `;
                        listDiv.appendChild(item);
                    });
                } else {
                    listDiv.innerHTML = '<p class="empty-tip">暂时还没有人报名</p>';
                }
            } catch (err) {
                listDiv.innerHTML = '<p class="empty-tip" style="color:#fa5151;">加载失败</p>';
            }
        }

        // ============ 签到 ============
        async function checkInStudent(registrationId) {
            const ok = await showConfirm('确定要为这位学生签到吗？');
            if (!ok) return;
            try {
                const res = await fetch(`/api/check_in/${registrationId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: currentUser.user_id })
                });
                const data = await res.json();
                if (data.code === 200) {
                    showToast('✓ 签到成功');
                    await loadEventRegistrations(currentEventId);
                } else {
                    showToast('✗ ' + data.message);
                }
            } catch (err) {
                showToast('⚠ 网络错误');
            }
        }

        // ============ 删除评论 ============
        async function deleteComment(commentId) {
            const ok = await showConfirm('确定要删除这条评论吗？');
            if (!ok) return;
            try {
                const res = await fetch(`/api/delete_comment/${commentId}`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: currentUser.user_id })
                });
                const data = await res.json();
                if (data.code === 200) {
                    showToast('✓ 评论已删除');
                    await loadComments(currentEventId);
                } else {
                    showToast('✗ ' + data.message);
                }
            } catch (err) {
                showToast('⚠ 网络错误');
            }
        }

        // ============ 评论区 ============
        async function loadComments(eventId) {
            const listDiv = document.getElementById('comment-list');
            listDiv.innerHTML = '<p class="empty-tip">加载中...</p>';
            try {
                const res = await fetch(`/api/comments/${eventId}`);
                const result = await res.json();
                if (result.code === 200 && result.data.length > 0) {
                    listDiv.innerHTML = '';
                    result.data.forEach(c => {
                        const item = document.createElement('div');
                        item.className = 'comment-item';
                        const time = formatDateTime(c.created_at);

                        const canDelete = (c.user_id === currentUser.user_id) || (currentUser.role === 'organizer');
                        const deleteBtn = canDelete
                            ? `<button class="btn-delete-comment" onclick="deleteComment(${c.comment_id})">删除</button>`
                            : '';

                        item.innerHTML = `
                            <div class="comment-header">
                                <span class="comment-author">${c.user_name} (${c.user_role}) ${deleteBtn}</span>
                                <span class="comment-time">${time}</span>
                            </div>
                            <div class="comment-content">${c.content}</div>
                        `;
                        listDiv.appendChild(item);
                    });
                } else {
                    listDiv.innerHTML = '<p class="empty-tip">还没有评论</p>';
                }
            } catch (err) {
                listDiv.innerHTML = '<p class="empty-tip" style="color:#fa5151;">加载失败</p>';
            }
        }

        // ============ 发表评论 ============
        async function submitComment() {
            const content = document.getElementById('comment-input').value.trim();
            if (!content) { showToast('⚠ 请输入评论内容'); return; }
            try {
                const res = await fetch('/api/comments', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        event_id: currentEventId,
                        user_id: currentUser.user_id,
                        content: content
                    })
                });
                const data = await res.json();
                if (data.code === 200) {
                    document.getElementById('comment-input').value = '';
                    showToast('✓ 评论已发布');
                    await loadComments(currentEventId);
                } else {
                    showToast('✗ ' + data.message);
                }
            } catch (err) {
                showToast('⚠ 网络错误');
            }
        }

        loadVenues();
        loadEvents();
    </script>

    <!-- 活动详情弹窗 -->
    <div id="detail-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">活动详情</h3>
                <span class="modal-close" onclick="closeDetail()">×</span>
            </div>
            <div class="modal-body">
                <div class="section">
                    <h4>👥 报名名单</h4>
                    <div id="registration-list-detail"></div>
                </div>
                <div class="section">
                    <h4>💬 评论区</h4>
                    <div id="comment-list"></div>
                    <div class="comment-form">
                        <textarea id="comment-input" placeholder="写下你的评论..." maxlength="500"></textarea>
                        <button class="btn-primary" onclick="submitComment()">发表评论</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
