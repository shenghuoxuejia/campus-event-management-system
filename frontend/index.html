<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园活动大厅</title>
    <link rel="icon" href="data:,">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: #ededed;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #07c160;
            color: white;
            padding: 18px 28px;
            border-radius: 12px;
            margin-bottom: 22px;
            box-shadow: 0 2px 12px rgba(7, 193, 96, 0.2);
        }
        .header h1 { font-size: 20px; font-weight: 500; }
        .header .user-info { font-size: 14px; }
        .header a { color: white; text-decoration: none; margin-left: 15px; opacity: 0.9; }
        .header a:hover { opacity: 1; text-decoration: underline; }
        .header button {
            margin-left: 15px;
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }
        .header button:hover { background: rgba(255, 255, 255, 0.3); }

        .panel {
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 22px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        .panel h3 { margin-bottom: 18px; color: #191919; font-size: 17px; font-weight: 500; }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }
        .form-grid input, .form-grid select {
            padding: 12px 14px;
            background: #f7f7f7;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            font-family: inherit;
            transition: all 0.2s;
        }
        .form-grid input:focus, .form-grid select:focus {
            border-color: #07c160;
            background: #fff;
        }

        .btn-primary {
            margin-top: 15px;
            padding: 12px 30px;
            background: #07c160;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary:hover { background: #06ad56; }

        .event-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 18px;
        }
        .event-card {
            background: #fff;
            border-radius: 12px;
            padding: 22px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            transition: all 0.2s;
        }
        .event-card:hover { box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08); }
        .event-card h3 { color: #191919; margin-bottom: 12px; font-size: 17px; font-weight: 500; }
        .event-card p { color: #888; font-size: 13px; margin: 6px 0; line-height: 1.6; }

        .status-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 10px;
            width: fit-content;
        }
        .status-open { background: #e8f8ef; color: #07c160; }
        .status-closed { background: #fdecec; color: #fa5151; }

        .btn-apply {
            width: 100%;
            padding: 11px;
            margin-top: 15px;
            background: #07c160;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-apply:hover:not(:disabled) { background: #06ad56; }
        .btn-apply:disabled { background: #ccc; cursor: not-allowed; }

        .btn-delete {
            width: 100%;
            margin-top: 8px;
            padding: 10px;
            background: #fff;
            color: #fa5151;
            border: 1px solid #fa5151;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-delete:hover { background: #fa5151; color: white; }

        .btn-toggle {
            width: 100%;
            margin-top: 8px;
            padding: 10px;
            background: #fff;
            color: #07c160;
            border: 1px solid #07c160;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-toggle:hover { background: #07c160; color: white; }

        .btn-edit {
            width: 100%;
            margin-top: 8px;
            padding: 10px;
            background: #fff;
            color: #576b95;
            border: 1px solid #576b95;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-edit:hover { background: #576b95; color: white; }

        .btn-remove {
            margin-left: 8px;
            padding: 5px 14px;
            background: #fff;
            color: #fa5151;
            border: 1px solid #fa5151;
            border-radius: 5px;
            font-size: 12px;
            cursor: pointer;
        }
        .btn-remove:hover { background: #fa5151; color: white; }

        .list-more { text-align: center; margin-top: 20px; }

        .category-picker { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .cat-checkbox {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 7px 14px; background: #f7f7f7; border: 1px solid #e5e5e5;
            border-radius: 999px; font-size: 13px; cursor: pointer; user-select: none;
        }
        .cat-checkbox input { accent-color: #07c160; }

        .filter-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
        .filter-chip {
            padding: 7px 16px; background: #fff; border: 1px solid #e5e5e5;
            border-radius: 999px; font-size: 13px; cursor: pointer; transition: all 0.2s;
        }
        .filter-chip:hover { border-color: #07c160; color: #07c160; }
        .filter-chip.active { background: #07c160; color: #fff; border-color: #07c160; }

        .cat-tag {
            display: inline-block; padding: 2px 9px; margin-right: 6px; margin-bottom: 6px;
            background: #eef6ff; color: #576b95; border-radius: 4px; font-size: 12px;
        }

        /* 弹窗样式 */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-content {
            background: white;
            border-radius: 12px;
            width: 100%;
            max-width: 600px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 25px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #eee;
        }
        .modal-header h3 { font-size: 18px; color: #191919; font-weight: 500; }
        .modal-close { font-size: 28px; color: #888; cursor: pointer; line-height: 1; padding: 0 8px; }
        .modal-close:hover { color: #fa5151; }

        .section { margin-bottom: 25px; }
        .section h4 { font-size: 15px; color: #191919; font-weight: 500; margin-bottom: 12px; }

        .reg-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: #f7f7f7;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .reg-item .name { color: #191919; font-weight: 500; margin-bottom: 2px; }
        .reg-item .email { color: #888; font-size: 12px; }

        .btn-checkin {
            padding: 5px 14px;
            background: #07c160;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 12px;
            cursor: pointer;
        }
        .btn-checkin:hover { background: #06ad56; }
        .checkin-status { font-size: 12px; color: #07c160; font-weight: 500; }
        .btn-undo-checkin {
            margin-left: 8px;
            padding: 5px 12px;
            background: #fff;
            color: #576b95;
            border: 1px solid #576b95;
            border-radius: 5px;
            font-size: 12px;
            cursor: pointer;
        }
        .btn-undo-checkin:hover { background: #576b95; color: #fff; }

        .comment-item {
            padding: 12px 14px;
            background: #f7f7f7;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .comment-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 12px;
        }
        .comment-author { color: #576b95; font-weight: 500; }
        .comment-time { color: #999; }
        .comment-content { color: #191919; font-size: 14px; line-height: 1.6; word-break: break-word; }

        .comment-form { margin-top: 15px; }
        .comment-form textarea {
            width: 100%;
            min-height: 80px;
            padding: 12px;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            outline: none;
            background: #f7f7f7;
        }
        .comment-form textarea:focus { border-color: #07c160; background: white; }
        .comment-form .btn-primary { margin-top: 10px; width: 100%; padding: 11px; font-size: 14px; }

        .empty-tip { color: #999; text-align: center; padding: 20px; font-size: 14px; }

        .btn-delete-comment {
            padding: 3px 10px;
            background: transparent;
            color: #fa5151;
            border: 1px solid #fa5151;
            border-radius: 5px;
            font-size: 11px;
            cursor: pointer;
            margin-left: 8px;
            transition: all 0.2s;
        }
        .btn-delete-comment:hover { background: #fa5151; color: white; }

        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 14px 24px;
            border-radius: 8px;
            font-size: 15px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s;
            z-index: 9999;
        }
        .toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* 自定义确认弹窗 */
        .confirm-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }
        .confirm-box {
            background: white;
            border-radius: 12px;
            width: 320px;
            padding: 25px 20px 20px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            animation: confirmFadeIn 0.2s ease;
        }
        @keyframes confirmFadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .confirm-title {
            font-size: 16px;
            font-weight: 500;
            color: #191919;
            margin-bottom: 12px;
        }
        .confirm-message {
            font-size: 14px;
            color: #666;
            margin-bottom: 22px;
            line-height: 1.6;
        }
        .confirm-buttons {
            display: flex;
            gap: 10px;
        }
        .confirm-btn {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }
        .confirm-btn.cancel { background: #f7f7f7; color: #666; }
        .confirm-btn.cancel:hover { background: #eee; }
        .confirm-btn.ok { background: #07c160; color: white; }
        .confirm-btn.ok:hover { background: #06ad56; }
    </style>
</head>

<body>

<!-- 统一为所有 API 请求附带登录令牌；令牌失效自动跳回登录页 -->
<script>
    (function () {
        const _fetch = window.fetch.bind(window);
        window.fetch = function (input, init) {
            init = init || {};
            const token = localStorage.getItem('token');
            if (token) {
                init.headers = Object.assign({}, init.headers, { 'Authorization': 'Bearer ' + token });
            }
            return _fetch(input, init).then(function (res) {
                if (res.status === 401 && location.pathname !== '/' && location.pathname.indexOf('login') === -1) {
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                    window.location.href = 'login.html';
                }
                return res;
            });
        };
    })();
</script>

    <!-- Toast 提示组件 -->
    <div id="toast" class="toast">
        <span id="toast-text"></span>
    </div>

    <!-- 自定义确认弹窗 -->
    <div id="confirm-modal" class="confirm-modal" style="display:none;">
        <div class="confirm-box">
            <div class="confirm-title">提示</div>
            <div class="confirm-message" id="confirm-message">确定要执行此操作吗？</div>
            <div class="confirm-buttons">
                <button class="confirm-btn cancel" onclick="closeConfirm(false)">取消</button>
                <button class="confirm-btn ok" onclick="closeConfirm(true)">确定</button>
            </div>
        </div>
    </div>

    <div class="header">
        <h1>校园活动大厅</h1>
        <div class="user-info" id="user-info"></div>
    </div>

    <div id="organizer-panel" class="panel" style="display:none;">
        <h3 id="panel-title">发布新活动 <span style="color:#aaa; font-size:13px;">（仅组织者可见）</span></h3>
        <div class="form-grid">
            <input type="text" id="new-title" placeholder="活动标题">
            <input type="number" id="new-capacity" placeholder="容量（人数）">
            <select id="new-venue-id">
                <option value="">请选择场地</option>
            </select>
            <input type="datetime-local" id="new-start-time">
            <input type="datetime-local" id="new-end-time">
            <input type="text" id="new-description" placeholder="活动描述">
        </div>
        <div class="category-picker" id="category-picker"></div>
        <button class="btn-primary" id="publish-btn" onclick="publishEvent()">发布活动</button>
        <button class="btn-toggle" id="cancel-edit-btn" style="display:none; width:auto; margin-left:10px;" onclick="resetEventForm()">取消编辑</button>
    </div>

    <div id="admin-panel" class="panel" style="display:none;">
        <h3>用户管理 <span style="color:#aaa; font-size:13px;">（仅管理员可见）</span></h3>
        <button class="btn-primary" onclick="loadAdminUsers()">加载用户列表</button>
        <p style="color:#999; font-size:12px; margin-top:8px;">组织者可以提为管理员，管理员可以降回组织者；被修改的账号需要重新登录才会看到新面板。</p>
        <div id="admin-user-list" style="margin-top:15px;"></div>
    </div>

    <div id="venue-panel" class="panel" style="display:none;">
        <h3>场地管理 <span style="color:#aaa; font-size:13px;">（仅管理员可见）</span></h3>
        <div class="form-grid">
            <input type="text" id="venue-name" placeholder="场地名称" maxlength="100">
            <input type="text" id="venue-location" placeholder="位置（如 教学区B栋）" maxlength="255">
            <input type="number" id="venue-capacity" placeholder="容量（人数）" min="1">
        </div>
        <button class="btn-primary" id="venue-submit-btn" onclick="submitVenue()">添加场地</button>
        <button class="btn-toggle" id="venue-cancel-btn" style="display:none; width:auto; margin-left:10px;" onclick="resetVenueForm()">取消编辑</button>
        <div id="admin-venue-list" style="margin-top:15px;"></div>
    </div>

    <div class="filter-bar" id="category-filter"></div>

    <div class="event-grid" id="event-list"></div>

    <div class="list-more">
        <button class="btn-primary" id="load-more-events" style="display:none;" onclick="loadMoreEvents()">加载更多活动</button>
    </div>

    <script>
        const userStr = localStorage.getItem('user');
        if (!userStr) {
            location.replace('login.html');
            throw new Error('未登录，已跳转');
        }
        let currentUser;
        try {
            currentUser = JSON.parse(userStr);
        } catch (e) {
            localStorage.removeItem('user');
            localStorage.removeItem('token');
            location.replace('login.html');
            throw e;
       }
        // HTML 转义（防 XSS）
        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // Toast 提示
        function showToast(message, duration = 1500) {
            const toast = document.getElementById('toast');
            const text = document.getElementById('toast-text');
            text.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, duration);
        }

        // 自定义确认弹窗
        let confirmResolve = null;

        function showConfirm(message) {
            return new Promise((resolve) => {
                document.getElementById('confirm-message').textContent = message;
                document.getElementById('confirm-modal').style.display = 'flex';
                confirmResolve = resolve;
            });
        }

        function closeConfirm(result) {
            document.getElementById('confirm-modal').style.display = 'none';
            if (confirmResolve) {
                confirmResolve(result);
                confirmResolve = null;
            }
        }

        // 时间格式化
        function formatDateTime(dateStr) {
            if (!dateStr) return '';
            const str = String(dateStr).replace('T', ' ');
            const datePart = str.split(' ')[0];
            const timePart = str.split(' ')[1] || '';
            if (!datePart) return str;
            const [y, m, d] = datePart.split('-');
            const [hh, mm] = timePart.split(':');
            if (!hh || !mm) {
                return `${y}年${parseInt(m)}月${parseInt(d)}日`;
            }
            return `${y}年${parseInt(m)}月${parseInt(d)}日 ${hh}:${mm}`;
        }
        // Safari 不认 '2026-01-01 10:00:00' 这种格式，得换成 '2026-01-01T10:00:00'
        function parseDbTime(s) {
            if (!s) return null;
            const d = new Date(String(s).replace(' ', 'T'));
            return isNaN(d.getTime()) ? null : d;
     }  

        // 用户信息
        document.getElementById('user-info').innerHTML = `
            ${escapeHtml(currentUser.name)} · ${escapeHtml(currentUser.role)}
            <a href="profile.html">我的报名</a>
            <button onclick="logout()">退出</button>
        `;

        // 管理员也能发活动（后端 create_event 允许 organizer 和 admin）
        if (currentUser.role === 'organizer' || currentUser.role === 'admin') {
            document.getElementById('organizer-panel').style.display = 'block';
        }
        if (currentUser.role === 'admin') {
            document.getElementById('admin-panel').style.display = 'block';
            document.getElementById('venue-panel').style.display = 'block';
            loadAdminVenues();
        }

        // 管理员 / 活动组织者本人 都可管理活动
        function ownerOf(event) {
            return currentUser.role === 'admin' ||
                (currentUser.role === 'organizer' && event.organizer_id === currentUser.user_id);
        }

        function logout() {
            // 先通知后端吊销令牌（失败也不阻塞退出），再清本地存储
            fetch('/api/logout', { method: 'POST' }).catch(() => {}).finally(() => {
                localStorage.removeItem('user');
                localStorage.removeItem('token');
                window.location.href = 'login.html';
            });
        }

        // 删除活动
        async function deleteEvent(eventId, btn) {
            const ok = await showConfirm('确定要删除这个活动吗？该操作不可恢复，所有报名记录也会被删除。');
            if (!ok) return;
            if (btn) { btn.disabled = true; btn.textContent = '删除中…'; }
            try {
                const response = await fetch(`/api/delete_event/${eventId}`, {
                    method: 'DELETE'
                });
                const data = await response.json();
                if (data.code === 200) {
                    showToast('活动已删除');
                    loadEvents('refresh');
                } else {
                    showToast(data.message);
                }
            } catch (error) {
                showToast('网络错误，请稍后重试');
            } finally {
                if (btn) { btn.disabled = false; btn.textContent = '删除活动'; }
            }
        }

        // 关闭 / 重新开放活动报名
        async function toggleEventStatus(eventId) {
            const ev = eventsCache.find(e => e.event_id === eventId);
            if (!ev) return;
            const newStatus = ev.status === 'open' ? 'closed' : 'open';
            const label = newStatus === 'closed' ? '关闭报名' : '重新开放';
            const ok = await showConfirm(`确定要${label}吗？`);
            if (!ok) return;
            try {
                const response = await fetch(`/api/close_event/${eventId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    // 后端只接受 close / open，不能直接传 'closed'
                    body: JSON.stringify({ action: newStatus === 'closed' ? 'close' : 'open' })
                });
                const data = await response.json();
                if (data.code === 200) {
                    showToast(data.message);
                    loadEvents('refresh');
                } else {
                    showToast(data.message);
                }
            } catch (error) {
                showToast('网络错误，请稍后重试');
            }
        }

        // 活动列表（分页）
        let eventsCache = [];
        let eventPage = 1;
        let eventPages = 0;

        function createEventCard(event) {
            const card = document.createElement('div');
            card.className = 'event-card';

            const isClosed = event.status === 'closed';
            // 后端列表接口已返回 started / ended（由数据库 NOW() 计算，不信前端时钟）
            const isEnded = Boolean(event.ended);
            const isStarted = Boolean(event.started) && !isEnded;
            const isOpen = !isClosed && !isStarted && !isEnded;
            const isRegistered = event.is_registered > 0;
            const isOwner = ownerOf(event);

            let statusText, statusClass;
            if (isClosed)       { statusText = '已关闭'; statusClass = 'status-closed'; }
            else if (isEnded)   { statusText = '已结束'; statusClass = 'status-closed'; }
            else if (isStarted) { statusText = '进行中'; statusClass = 'status-open'; }
            else                { statusText = '报名中'; statusClass = 'status-open'; }
            const categoryTags = (event.categories || []).map(c =>
                `<span class="cat-tag">${escapeHtml(c.category_name)}</span>`
            ).join('');

            let buttonText = '立即报名';
            let buttonDisabled = false;
            if (isClosed)          { buttonText = '活动已关闭'; buttonDisabled = true; }
            else if (isEnded)      { buttonText = '活动已结束'; buttonDisabled = true; }
            else if (isStarted)    { buttonText = '活动进行中'; buttonDisabled = true; }
            else if (isRegistered) { buttonText = '已报名'; buttonDisabled = true; }

            // 只有学生可以报名（组织者负责发布/签到，管理员负责监管）
            const applyBtn = currentUser.role !== 'student' ? '' : `
                <button class="btn-apply" onclick="applyEvent(${event.event_id}, this)" ${buttonDisabled ? 'disabled' : ''}>
                    ${buttonText}
                </button>`;

            const manageBtns = isOwner ? `
                <button class="btn-edit" onclick="startEditEvent(${event.event_id})">编辑活动</button>
                <button class="btn-toggle" onclick="toggleEventStatus(${event.event_id})">${isClosed ? '重新开放' : '关闭报名'}</button>
                <button class="btn-delete" onclick="deleteEvent(${event.event_id}, this)">删除活动</button>` : '';

            card.innerHTML = `
                <span class="status-badge ${statusClass}">${statusText}</span>
                <div>${categoryTags}</div>
                <h3 style="cursor:pointer;" onclick="openDetail(${event.event_id})">${escapeHtml(event.title)} <span style="font-size:12px; color:#07c160;">查看详情</span></h3>
                <p>${escapeHtml(event.description || '暂无描述')}</p>
                <p>地点：${escapeHtml(event.venue_name || '待定')}（${escapeHtml(event.venue_location || '')}）</p>
                <p>时间：${formatDateTime(event.start_time)}</p>
                <p>容量：${event.capacity} 人，已报 ${event.registered_count} 人，余 ${event.remaining} 人</p>
                ${applyBtn}
                ${manageBtns}
            `;
            return card;
        }

        async function loadEvents(mode = 'reset') {
            // 兼容旧调用：loadEvents(true/false) / loadEvents('refresh')
            if (mode === true) mode = 'reset';
            else if (mode === false) mode = 'more';

            const listDiv = document.getElementById('event-list');
            const moreBtn = document.getElementById('load-more-events');
            // reset：从第 1 页重拉；more：追加下一页；
            // refresh：保持当前页码，但把 1..N 页全部重新拉一遍（缓存完整、页码不丢）
            const targetPage = mode === 'reset' ? 1 : (mode === 'more' ? eventPage + 1 : eventPage);
            const firstPage = mode === 'more' ? targetPage : 1;

            try {
                let items = [];
                let pages = 0;
                for (let p = firstPage; p <= targetPage; p++) {
                    let url = `/api/events?page=${p}&page_size=12`;
                    if (currentCategoryFilter) url += `&category_id=${currentCategoryFilter}`;
                    const response = await fetch(url);
                    const result = await response.json();
                    if (result.code !== 200) {
                        if (mode !== 'more') {
                            listDiv.innerHTML = `<p style="color:#fa5151; text-align:center; grid-column:1/-1;">${escapeHtml(result.message || '加载失败')}</p>`;
                        }
                        moreBtn.style.display = 'none';
                        return;
                    }
                    items = items.concat(result.data);
                    pages = result.pages || 0;
                    if (p >= pages) break;
                }

                eventPage = targetPage;
                eventPages = pages;
                eventsCache = items;
                listDiv.innerHTML = '';
                items.forEach(event => listDiv.appendChild(createEventCard(event)));
                if (items.length === 0) {
                    listDiv.innerHTML = '<p style="text-align:center; color:#888; grid-column:1/-1;">暂无活动。</p>';
                }
                moreBtn.style.display = eventPage < eventPages ? 'inline-block' : 'none';
            } catch (error) {
                console.error(error);
                if (mode !== 'more') {
                    listDiv.innerHTML = '<p style="color:#fa5151; text-align:center; grid-column:1/-1;">无法连接后端，请确认后端已启动。</p>';
                }
                moreBtn.style.display = 'none';
            }
        }

        function loadMoreEvents() {
            // 页码在请求成功后才推进（loadEvents 内部处理），失败不会跳过一页
            loadEvents('more');
        }

        // 报名
        async function applyEvent(eventId, btn) {
            if (btn) { btn.disabled = true; btn.textContent = '提交中…'; }
            const ok = await showConfirm('确定要报名参加这个活动吗？');
            if (!ok) {
                if (btn) { btn.disabled = false; btn.textContent = '立即报名'; }
                return;
            }
            try {
                const response = await fetch('/api/register_event', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ event_id: eventId })
                });
                const data = await response.json();
                if (data.code === 200) {
                    showToast('报名成功');
                    loadEvents('refresh');
                } else {
                    showToast(data.message);
                }
            } catch (error) {
                showToast('网络错误，请稍后重试');
            } finally {
                if (btn) { btn.disabled = false; btn.textContent = '立即报名'; }
            }
        }

        // 发布 / 编辑活动
        let editingEventId = null;

        function toInputValue(value) {
            if (!value) return '';
            return String(value).replace(' ', 'T').slice(0, 16);
        }

        function resetEventForm() {
            editingEventId = null;
            ['new-title', 'new-capacity', 'new-venue-id', 'new-start-time', 'new-end-time', 'new-description']
                .forEach(id => document.getElementById(id).value = '');
            setSelectedCategoryIds([]);
            document.getElementById('panel-title').textContent = '发布新活动';
            document.getElementById('publish-btn').textContent = '发布活动';
            document.getElementById('cancel-edit-btn').style.display = 'none';
        }

        function startEditEvent(eventId) {
            const ev = eventsCache.find(e => e.event_id === eventId);
            if (!ev) return;
            editingEventId = eventId;
            document.getElementById('organizer-panel').style.display = 'block';
            document.getElementById('new-title').value = ev.title || '';
            document.getElementById('new-capacity').value = ev.capacity || '';
            document.getElementById('new-venue-id').value = ev.venue_id || '';
            document.getElementById('new-start-time').value = toInputValue(ev.start_time);
            document.getElementById('new-end-time').value = toInputValue(ev.end_time);
            document.getElementById('new-description').value = ev.description || '';
            setSelectedCategoryIds((ev.categories || []).map(c => c.category_id));
            document.getElementById('panel-title').textContent = `编辑活动：#${ev.event_id}`;
            document.getElementById('publish-btn').textContent = '保存修改';
            document.getElementById('cancel-edit-btn').style.display = 'inline-block';
            document.getElementById('organizer-panel').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        async function publishEvent() {
            const title = document.getElementById('new-title').value;
            const capacity = document.getElementById('new-capacity').value;
            const venueId = document.getElementById('new-venue-id').value;
            const startTime = document.getElementById('new-start-time').value;
            const endTime = document.getElementById('new-end-time').value;
            const description = document.getElementById('new-description').value;

            if (!title || !capacity || !venueId || !startTime || !endTime) {
                showToast('请填写所有必填字段');
                return;
            }

            const isEdit = !!editingEventId;
            const btn = document.getElementById('publish-btn');
            if (btn.disabled) return;           // 防连点：双击不会重复发布
            btn.disabled = true;
            btn.textContent = isEdit ? '保存中…' : '发布中…';
            try {
                const response = await fetch(isEdit ? `/api/update_event/${editingEventId}` : '/api/create_event', {
                    method: isEdit ? 'PUT' : 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title, description,
                        venue_id: parseInt(venueId),
                        start_time: startTime.replace('T', ' ') + ':00',
                        end_time: endTime.replace('T', ' ') + ':00',
                        capacity: parseInt(capacity),
                        category_ids: getSelectedCategoryIds()
                    })
                });
                const data = await response.json();
                if (data.code === 200) {
                    showToast(data.message);
                    resetEventForm();
                    loadEvents();
                } else {
                    showToast(data.message);
                }
            } catch (error) {
                showToast('网络错误，请稍后重试');
            } finally {
                btn.disabled = false;
                btn.textContent = editingEventId ? '保存修改' : '发布活动';
            }
        }

        // 加载场地
        async function loadVenues() {
            try {
                const response = await fetch('/api/venues');
                const result = await response.json();
                const select = document.getElementById('new-venue-id');
                if (result.code === 200) {
                    // 只保留第一个「请选择场地」，避免刷新后重复追加
                    select.length = 1;
                    result.data.forEach(venue => {
                        const option = document.createElement('option');
                        option.value = venue.venue_id;
                        option.textContent = `${venue.venue_name}（${venue.location}，容量 ${venue.capacity}）`;
                        select.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('加载场地失败:', error);
            }
        }

        // 分类：加载、渲染（发布表单多选 + 大厅筛选）
        let allCategories = [];
        let currentCategoryFilter = null;

        async function loadCategories() {
            try {
                const response = await fetch('/api/categories');
                const result = await response.json();
                if (result.code === 200) {
                    allCategories = result.data;
                    renderCategoryPicker();
                    renderCategoryFilter();
                }

                console.error('加载分类失败:', error);

        function renderCategoryPicker() {
            const box = document.getElementById('category-picker');
            box.innerHTML = allCategories.map(c => `
                <label class="cat-checkbox">
                    <input type="checkbox" value="${c.category_id}" class="cat-check-input">
                    <span>${escapeHtml(c.category_name)}</span>
                </label>
            `).join('');
        }

        function getSelectedCategoryIds() {
            return Array.from(document.querySelectorAll('.cat-check-input:checked'))
                .map(el => parseInt(el.value));
        }

        function setSelectedCategoryIds(ids) {
            const wanted = new Set(ids);
            document.querySelectorAll('.cat-check-input').forEach(el => {
                el.checked = wanted.has(parseInt(el.value));
            });
        }

        function renderCategoryFilter() {
            const box = document.getElementById('category-filter');
            const allChip = `<button class="filter-chip ${currentCategoryFilter === null ? 'active' : ''}" onclick="setCategoryFilter(null)">全部</button>`;
            const chips = allCategories.map(c => `
                <button class="filter-chip ${currentCategoryFilter === c.category_id ? 'active' : ''}" onclick="setCategoryFilter(${c.category_id})">${escapeHtml(c.category_name)}</button>
            `).join('');
            box.innerHTML = allChip + chips;
        }

        function setCategoryFilter(cid) {
            currentCategoryFilter = cid;
            renderCategoryFilter();
            loadEvents(true);
        }

        // 活动详情弹窗
        let currentEvent = null;
        let currentEventId = null;

        async function openDetail(eventId) {
            currentEventId = eventId;
            const res = await fetch(`/api/events/${eventId}`);
            const result = await res.json();
            if (result.code !== 200) { showToast(result.message); return; }
            currentEvent = result.data;

            document.getElementById('modal-title').textContent = currentEvent.title;
            const isOwner = currentUser.role === 'admin' ||
                (currentUser.role === 'organizer' && currentEvent.organizer_id === currentUser.user_id);
            document.getElementById('registration-section').style.display = isOwner ? 'block' : 'none';
            document.getElementById('detail-modal').style.display = 'flex';
            document.getElementById('comment-input').value = '';
            if (isOwner) {
                await loadEventRegistrations(eventId, true);
            }
            await loadComments(eventId, true);
        }

        function closeDetail() {
            document.getElementById('detail-modal').style.display = 'none';
            currentEventId = null;
        }

        // 报名名单（分页）
        let regPage = 1;
        let regPages = 0;

        function createRegRow(reg) {
            const item = document.createElement('div');
            item.className = 'reg-item';
            const isCancelled = reg.registration_status === 'cancelled';
            const isCheckedIn = reg.registration_status === 'checked_in';
            let actionHtml;
            if (isCancelled) {
                const who = reg.cancelled_by_name ? `（${escapeHtml(reg.cancelled_by_name)} 操作）` : '';
                const when = reg.cancelled_at ? formatDateTime(reg.cancelled_at) : '';
                actionHtml = `<span class="checkin-status">已取消${who} ${when}</span>`;
            } else if (isCheckedIn) {
                actionHtml = `<span class="checkin-status">已签到</span>
                   <button class="btn-undo-checkin" onclick="undoCheckIn(${reg.registration_id}, this)">撤销签到</button>`;
            } else {
                actionHtml = `<button class="btn-checkin" onclick="checkInStudent(${reg.registration_id}, this)">签到</button>
                   <button class="btn-remove" onclick="removeRegistration(${reg.registration_id})">移除</button>`;
            }
            item.innerHTML = `
                <div>
                    <div class="name">${escapeHtml(reg.student_name)}</div>
                    <div class="email">${escapeHtml(reg.student_email)}</div>
                </div>
                <div>${actionHtml}</div>
            `;
            return item;
        }

        async function loadEventRegistrations(eventId, reset = true) {
            const listDiv = document.getElementById('registration-list-detail');
            const moreBtn = document.getElementById('load-more-regs');
            const targetPage = reset ? 1 : regPage + 1;
            if (reset) {
                listDiv.innerHTML = '<p class="empty-tip">加载中...</p>';
            }
            try {
                const withCancelled = document.getElementById('show-cancelled')
                    && document.getElementById('show-cancelled').checked;
                const query = `page=${targetPage}&page_size=20` + (withCancelled ? '&include_cancelled=1' : '');
                const res = await fetch(`/api/event_registrations/${eventId}?${query}`);
                const result = await res.json();
                if (result.code !== 200) {
                    listDiv.innerHTML = `<p class="empty-tip" style="color:#fa5151;">${escapeHtml(result.message || '加载失败')}</p>`;
                    moreBtn.style.display = 'none';
                    return;
                }
                if (reset) listDiv.innerHTML = '';
                if (reset && result.data.length === 0) {
                    listDiv.innerHTML = '<p class="empty-tip">暂时还没有人报名</p>';
                }
                regPage = targetPage;
                result.data.forEach(reg => listDiv.appendChild(createRegRow(reg)));
                regPages = result.pages;
                moreBtn.style.display = regPage < regPages ? 'inline-block' : 'none';
            } catch (err) {
                listDiv.innerHTML = '<p class="empty-tip" style="color:#fa5151;">加载失败</p>';
                moreBtn.style.display = 'none';
            }
        }

        function loadMoreRegs() {
            loadEventRegistrations(currentEventId, false);
        }

        // 组织者将学生移出活动

            const ok = await showConfirm('确定要把这位学生移出活动吗？该名额将被释放。');
            if (!ok) return;
            try {
                const res = await fetch(`/api/remove_registration/${registrationId}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.code === 200) {
                    showToast(data.message);
                    await loadEventRegistrations(currentEventId, true);
                    loadEvents('refresh');
                } else {
                    showToast(data.message);
                }
            } catch (err) {
                showToast('网络错误，请稍后重试');
            }
        }

        async function checkInStudent(registrationId, btn) {
            const ok = await showConfirm('确定要为这位学生签到吗？');
            if (!ok) return;
            if (btn) { btn.disabled = true; btn.textContent = '签到中…'; }
            try {
                const res = await fetch(`/api/check_in/${registrationId}`, {
                    method: 'PUT',

                    showToast('签到成功');

                } else {

                    showToast('已撤销签到');

                } else {
                    showToast(data.message);
                }
            } catch (err) {
                showToast('网络错误，请稍后重试');

        // 删除评论
        async function deleteComment(commentId) {
            const ok = await showConfirm('确定要删除这条评论吗？');
            if (!ok) return;
            try {
                const res = await fetch(`/api/delete_comment/${commentId}`, {
                    method: 'DELETE'
                });
                const data = await res.json();
                if (data.code === 200) {
                    showToast('评论已删除');
                    await loadComments(currentEventId);
                } else {
                    showToast(data.message);
                }
            } catch (err) {
                showToast('网络错误，请稍后重试');

        // 评论区（分页）
        let commentPage = 1;
        let commentPages = 0;

        function createCommentRow(c, canManage) {
            const item = document.createElement('div');
            item.className = 'comment-item';
            const canDelete = c.user_id === currentUser.user_id || canManage;
            const deleteBtn = canDelete
                ? `<button class="btn-delete-comment" onclick="deleteComment(${c.comment_id})">删除</button>`
                : '';
            item.innerHTML = `
                <div class="comment-header">
                    <span class="comment-author">${escapeHtml(c.user_name)} (${escapeHtml(c.user_role)}) ${deleteBtn}</span>
                    <span class="comment-time">${formatDateTime(c.created_at)}</span>
                </div>
                <div class="comment-content">${escapeHtml(c.content)}</div>
            `;
            return item;
        }

        async function loadComments(eventId, reset = true) {
            const listDiv = document.getElementById('comment-list');
            const moreBtn = document.getElementById('load-more-comments');
            const targetPage = reset ? 1 : commentPage + 1;
            if (reset) {
                listDiv.innerHTML = '<p class="empty-tip">加载中...</p>';
            }
            try {
                const res = await fetch(`/api/comments/${eventId}?page=${targetPage}&page_size=20`);
                const result = await res.json();
                if (result.code !== 200) {
                    listDiv.innerHTML = `<p class="empty-tip" style="color:#fa5151;">${escapeHtml(result.message || '加载失败')}</p>`;
                    moreBtn.style.display = 'none';
                    return;
                }
                if (reset) listDiv.innerHTML = '';
                if (reset && result.data.length === 0) {
                    listDiv.innerHTML = '<p class="empty-tip">还没有评论</p>';
                }
                const canManage = !!(currentEvent && (
                    currentUser.role === 'admin' ||
                    (currentUser.role === 'organizer' && currentEvent.organizer_id === currentUser.user_id)
                ));
                commentPage = targetPage;
                result.data.forEach(c => listDiv.appendChild(createCommentRow(c, canManage)));
                commentPages = result.pages;
                moreBtn.style.display = commentPage < commentPages ? 'inline-block' : 'none';
            } catch (err) {
                listDiv.innerHTML = '<p class="empty-tip" style="color:#fa5151;">加载失败</p>';
                moreBtn.style.display = 'none';
            }
        }

        function loadMoreComments() {
            loadComments(currentEventId, false);
        }

        // 发表评论
        async function submitComment(btn) {
            const content = document.getElementById('comment-input').value.trim();
            if (!content) { showToast('请输入评论内容'); return; }
            if (btn) { btn.disabled = true; btn.textContent = '发布中…'; }
            try {
                const res = await fetch('/api/comments', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        event_id: currentEventId,
                        content: content
                    })
                });
                const data = await res.json();
                if (data.code === 200) {
                    document.getElementById('comment-input').value = '';
                    showToast('评论已发布');
                    await loadComments(currentEventId);
                } else {
                    showToast(data.message);
                }
            } catch (err) {
                showToast('网络错误，请稍后重试');
            } finally {
                if (btn) { btn.disabled = false; btn.textContent = '发表评论'; }
            }
        }

        // 管理员：用户列表（分页）
        let adminUserPage = 1;
        let adminUserPages = 0;
        
        async function loadAdminUsers(reset = true) {
            const box = document.getElementById('admin-user-list');
            const targetPage = reset ? 1 : adminUserPage + 1;
            if (reset) box.innerHTML = '<p class="empty-tip">加载中...</p>';
            try {
                const res = await fetch(`/api/admin/users?page=${targetPage}&page_size=50`);
                const result = await res.json();
                if (result.code !== 200) {
                    if (reset) box.innerHTML = `<p class="empty-tip" style="color:#fa5151;">${escapeHtml(result.message || '加载失败')}</p>`;

                    <div class="reg-item">

        // 角色按钮：只有组织者能提成管理员、管理员能降回组织者，学生和自己不显示
        function roleButton(user) {
            if (user.user_id === currentUser.user_id) {
                return '<span style="color:#aaa; font-size:12px;">当前账号</span>';
            }
            if (user.role === 'organizer') {
                return `<button class="btn-toggle" style="width:auto; margin:0; padding:6px 12px;" onclick="setUserRole(${user.user_id}, 'admin')">设为管理员</button>`;
            }
            if (user.role === 'admin') {
                return `<button class="btn-toggle" style="width:auto; margin:0; padding:6px 12px;" onclick="setUserRole(${user.user_id}, 'organizer')">降为组织者</button>`;
            }
            return '';
        }

        async function setUserRole(userId, role) {
            const label = role === 'admin' ? '管理员' : '组织者';
            const ok = await showConfirm(`确定把这个账号设为${label}吗？对方需要重新登录才会看到新的面板。`);
            if (!ok) return;
            try {
                const res = await fetch(`/api/admin/users/${userId}/role`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ role: role })
                });
                const data = await res.json();
                showToast(data.message || '已更新');
                if (data.code === 200) {
                    await loadAdminUsers();
                }
            } catch (err) {
                showToast('网络错误，请稍后重试');
            }
        }

        // 管理员：场地管理
        let adminVenues = [];
        let editingVenueId = null;
        let editingVenueStatus = 1;

        async function loadAdminVenues() {
            const box = document.getElementById('admin-venue-list');
            box.innerHTML = '<p class="empty-tip">加载中...</p>';
            try {
                const res = await fetch('/api/admin/venues');
                const result = await res.json();
                if (result.code !== 200) {
                    box.innerHTML = `<p class="empty-tip" style="color:#fa5151;">${escapeHtml(result.message || '加载失败')}</p>`;
                    return;
                }
                adminVenues = result.data;
                if (!adminVenues.length) {
                    box.innerHTML = '<p class="empty-tip">还没有场地，先在上面加一个</p>';
                    return;
                }
                box.innerHTML = adminVenues.map(v => `
                    <div class="reg-item">
                        <div>
                            <div class="name">#${v.venue_id} ${escapeHtml(v.venue_name)}</div>
                            <div class="email">${escapeHtml(v.location || '未填位置')}，容量 ${v.capacity} 人，已排 ${v.event_count} 个活动</div>
                        </div>
                        <div style="display:flex; align-items:center; gap:8px;">
                            <span class="status-badge ${v.available_status ? 'status-open' : 'status-closed'}" style="margin-bottom:0;">${v.available_status ? '可用' : '停用'}</span>
                            <button class="btn-toggle" style="width:auto; margin:0; padding:6px 12px;" onclick="editVenue(${v.venue_id})">编辑</button>
                            <button class="btn-toggle" style="width:auto; margin:0; padding:6px 12px;" onclick="toggleVenue(${v.venue_id})">${v.available_status ? '停用' : '启用'}</button>
                            <button class="btn-delete" style="width:auto; margin:0; padding:6px 12px;" onclick="deleteVenue(${v.venue_id})">删除</button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                box.innerHTML = '<p class="empty-tip" style="color:#fa5151;">加载失败</p>';
            }
        }

        function editVenue(venueId) {
            const venue = adminVenues.find(v => v.venue_id === venueId);
            if (!venue) return;
            editingVenueId = venueId;
            editingVenueStatus = venue.available_status;
            document.getElementById('venue-name').value = venue.venue_name;
            document.getElementById('venue-location').value = venue.location || '';
            document.getElementById('venue-capacity').value = venue.capacity;
            document.getElementById('venue-submit-btn').textContent = '保存修改';
            document.getElementById('venue-cancel-btn').style.display = 'inline-block';
        }

        function resetVenueForm() {
            editingVenueId = null;
            editingVenueStatus = 1;
            ['venue-name', 'venue-location', 'venue-capacity'].forEach(id => {
                document.getElementById(id).value = '';
            });
            document.getElementById('venue-submit-btn').textContent = '添加场地';
            document.getElementById('venue-cancel-btn').style.display = 'none';
        }

        // 新增 / 修改共用
        async function submitVenue() {
            const name = document.getElementById('venue-name').value.trim();
            const location = document.getElementById('venue-location').value.trim();
            const capacity = document.getElementById('venue-capacity').value;
            if (!name || !capacity) {
                showToast('请填写场地名称和容量');
                return;
            }
            const editing = editingVenueId !== null;
            const btn = document.getElementById('venue-submit-btn');
            btn.disabled = true;
            try {
                const res = await fetch(editing ? `/api/venues/${editingVenueId}` : '/api/venues', {
                    method: editing ? 'PUT' : 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        venue_name: name,
                        location: location,
                        capacity: parseInt(capacity, 10),
                        available_status: editing ? editingVenueStatus : 1
                    })
                });
                const data = await res.json();
                showToast(data.message || (data.code === 200 ? '已保存' : '保存失败'));
                if (data.code === 200) {
                    resetVenueForm();
                    await loadAdminVenues();
                    await loadVenues();
                }
            } catch (err) {
                showToast('网络错误，请稍后重试');
            } finally {
                btn.disabled = false;
            }
        }

        // 停用 / 启用：停用后发布活动时就选不到它了
        async function toggleVenue(venueId) {
            const venue = adminVenues.find(v => v.venue_id === venueId);
            if (!venue) return;
            try {
                const res = await fetch(`/api/venues/${venueId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        venue_name: venue.venue_name,
                        location: venue.location || '',
                        capacity: venue.capacity,
                        available_status: venue.available_status ? 0 : 1
                    })
                });
                const data = await res.json();
                showToast(data.message || '已更新');
                if (data.code === 200) {
                    await loadAdminVenues();
                    await loadVenues();
                }
            } catch (err) {
                showToast('网络错误，请稍后重试');
            }
        }

        async function deleteVenue(venueId) {
            const ok = await showConfirm('确定要删除这个场地吗？');
            if (!ok) return;
            try {
                const res = await fetch(`/api/venues/${venueId}`, { method: 'DELETE' });
                const data = await res.json();
                showToast(data.message || '已删除');
                if (data.code === 200) {
                    await loadAdminVenues();
                    await loadVenues();
                }
            } catch (err) {
                showToast('网络错误，请稍后重试');
            }
        }

        loadVenues();
        loadCategories();
        loadEvents();
    </script>

    <!-- 活动详情弹窗 -->
    <div id="detail-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">活动详情</h3>
                <span class="modal-close" onclick="closeDetail()">×</span>
            </div>
            <div class="modal-body">
                <div class="section" id="registration-section">
                    <h4>报名名单
                        <label style="font-size:12px; font-weight:normal; color:#888; margin-left:10px; cursor:pointer;">
                            <input type="checkbox" id="show-cancelled"
                                   onchange="loadEventRegistrations(currentEventId, true)"> 显示已取消
                        </label>
                    </h4>
                    <div id="registration-list-detail"></div>
                    <div style="text-align:center;">
                        <button class="btn-toggle" id="load-more-regs" style="display:none;" onclick="loadMoreRegs()">加载更多报名</button>
                    </div>
                </div>
                <div class="section">
                    <h4>评论区</h4>
                    <div id="comment-list"></div>
                    <div style="text-align:center;">
                        <button class="btn-toggle" id="load-more-comments" style="display:none;" onclick="loadMoreComments()">加载更多评论</button>
                    </div>
                    <div class="comment-form">
                        <textarea id="comment-input" placeholder="写下你的评论..." maxlength="500"></textarea>
                        <button class="btn-primary" onclick="submitComment(this)">发表评论</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
